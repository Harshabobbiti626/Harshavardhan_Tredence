[project]
name = "aqua-self-pruning-network"
version = "0.1.0"
description = "Self-pruning neural network with custom reverse-mode autodiff and honest sparse cost measurement for AQUA Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "nn*", "prune*", "train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
reportMissingImports = "none"
reportMissingModuleSource = "none"



